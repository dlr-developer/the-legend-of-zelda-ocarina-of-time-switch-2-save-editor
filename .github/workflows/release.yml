name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Verify Tag Version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          APP_VER=$(python -c "import oot_save_editor; print(oot_save_editor.APP_VERSION)")
          echo "GitHub Ref Name: $TAG"
          echo "APP_VERSION from code: $APP_VER"
          if [ "${{ github.ref_type }}" = "tag" ] || [[ "$TAG" =~ ^v[0-9] ]]; then
            TAG_VER="${TAG#v}"
            if [ "$TAG_VER" != "$APP_VER" ]; then
              echo "Error: Tag version '$TAG_VER' does not match APP_VERSION '$APP_VER'"
              exit 1
            fi
          fi

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -v
          python tests/smoke_guides.py

      - name: Build standalone executable and release package
        run: |
          python tools/build_release.py

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ] && [[ ! "$TAG" =~ ^v[0-9] ]]; then
            APP_VER=$(python -c "import oot_save_editor; print(oot_save_editor.APP_VERSION)")
            TAG="v${APP_VER}"
          fi
          echo "Creating release for tag: $TAG"
          gh release create "$TAG" dist/*.zip --title "The Legend of Zelda Ocarina of Time Switch 2 Save Editor $TAG" --generate-notes
