name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Verify Tag Version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          APP_VER=$(python -c "import oot_save_editor; print(oot_save_editor.APP_VERSION)")
          echo "GitHub Ref Type: $REF_TYPE"
          echo "GitHub Ref Name: $REF_NAME"
          echo "APP_VERSION from code: $APP_VER"
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v${APP_VER}" ]; then
              echo "Error: Tag '$REF_NAME' must equal 'v${APP_VER}'"
              exit 1
            fi
          fi

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -v
          python tests/smoke_guides.py

      - name: Build standalone executable and release package
        run: |
          python tools/build_release.py

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          APP_VER=$(python -c "import oot_save_editor; print(oot_save_editor.APP_VERSION)")
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            echo "Creating release for tag: $TAG"
            gh release create "$TAG" dist/*.zip --title "The Legend of Zelda Ocarina of Time Switch 2 Save Editor $TAG" --generate-notes
          else
            TAG="v${APP_VER}"
            echo "Creating release for tag: $TAG at target $GITHUB_SHA"
            gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "The Legend of Zelda Ocarina of Time Switch 2 Save Editor $TAG" --generate-notes
          fi
